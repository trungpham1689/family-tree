name = "gia-pha-nhac-nho"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# Chạy mỗi ngày 00:00 UTC (7:00 giờ Việt Nam); code chỉ gửi vào ngày chia hết cho 5 (isDigestDay), và chỉ khi có giỗ/Sự kiện trong 5 ngày tới.
[triggers]
crons = ["0 0 * * *"]

[vars]
# URL Supabase, giống VITE_SUPABASE_URL ở apps/web/.env — không phải bí mật.
SUPABASE_URL = "https://gihidxqjfcezsrcibrla.supabase.co"
# Địa chỉ web, để chèn link "Xem trên Gia Phả" trong email.
APP_URL = "https://gia-pha.pages.dev"
# Email gửi đi; onboarding@resend.dev dùng được ngay không cần xác minh domain,
# nhưng Resend giới hạn chỉ gửi về đúng email đã đăng ký tài khoản Resend.
# Có domain riêng thì đổi sang địa chỉ @tên-miền-của-bạn và xác minh domain đó trên Resend.
RESEND_FROM = "Gia Phả <onboarding@resend.dev>"

# Bí mật — đặt bằng `wrangler secret put <tên>`, không ghi vào đây:
#   SUPABASE_SERVICE_ROLE_KEY  (Supabase Dashboard → Project Settings → API)
#   RESEND_API_KEY             (Resend Dashboard → API Keys)
