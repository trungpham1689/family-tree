# Email gửi đi, dạng "Tên <email>". Địa chỉ phải đã xác minh trong Brevo (Senders, Domains & Dedicated IPs → Senders).
# Dùng Gmail cá nhân (không có domain riêng) vẫn gửi được nhưng Brevo thay địa chỉ người gửi bằng địa chỉ của Brevo và mail dễ vào Spam.
BREVO_FROM = "Family Tree <trungpham168@gmail.com>"

