name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Test (unit + seam B trên PGlite)
        run: pnpm test:all
      - name: Build
        run: pnpm build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

  migrations-pg17:
    # Áp mọi migration lên Postgres 17 thật (PGlite chỉ là bản giả lập) rồi kiểm các bất biến của catalog.
    # Fidelity: vẫn là superuser và dùng tests/db/supabase-shim.sql thay cho phần Supabase; engine thì là thật.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Áp shim Supabase và mọi migration (theo thứ tự tên file)
        run: |
          psql -v ON_ERROR_STOP=1 -q -f tests/db/supabase-shim.sql
          for file in $(ls supabase/migrations/*.sql | sort); do
            echo "== $file"
            psql -v ON_ERROR_STOP=1 -q -f "$file"
          done
      - name: Kiểm bất biến catalog (mỗi dòng là một vi phạm)
        run: |
          violations=$(psql -v ON_ERROR_STOP=1 -tA -f tests/db/catalog-invariants.sql)
          if [ -n "$violations" ]; then echo "$violations"; exit 1; fi

  e2e:
    # Test khói: app thật trong Chromium, chạy trên backend giả lập (PGlite + PostgREST + auth giả).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGREST_VERSION: v12.2.12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cài PostgREST
        run: |
          mkdir -p .tools
          curl -fsSL "https://github.com/PostgREST/postgrest/releases/download/${POSTGREST_VERSION}/postgrest-${POSTGREST_VERSION}-linux-static-x86-64.tar.xz" \
            | tar -xJ -C .tools
          .tools/postgrest --version
      - name: Cài Chromium cho Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Test khói end-to-end
        run: pnpm test:e2e
      - name: Lưu ảnh chụp khi có lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-anh-chup
          path: e2e/.out/
          retention-days: 7
